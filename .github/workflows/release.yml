name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lode.c amalgamation
        run: ./build_lode.sh

      - name: Verify Lode.c compiles with judge flags
        run: gcc -DEVAL -std=gnu11 -Wall -Werror -O2 -pipe -static -s -o Lode Lode.c -lm

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" Lode.c \
            --title "v${{ github.run_number }}" \
            --notes "Automated release from commit ${{ github.sha }}"
